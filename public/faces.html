<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>에그런 얼굴</title>
  <style>
    html, body { margin: 0; background: #141820; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c" width="1440" height="460"></canvas>
<script>
const ctx = document.getElementById("c").getContext("2d");
ctx.fillStyle = "#141820";
ctx.fillRect(0, 0, 1440, 460);

function bot(cx, ground, sx, sy, mode) {
  const R = 78;
  ctx.save();
  ctx.translate(cx, ground);
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath();
  ctx.ellipse(0, 10, 52 * sx, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  if (mode === "dead") ctx.rotate(-0.35);
  ctx.scale(sx, sy);
  ctx.translate(0, -R);
  ctx.fillStyle = "#f4efe6";
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fill();
  const eyes = [
    { x: 16, y: -6 },
    { x: 43, y: 4 },
  ];
  const lookY = mode === "jump" ? -3 : 0;
  for (const eye of eyes) {
    ctx.save();
    ctx.translate(eye.x, eye.y);
    ctx.scale(1 / sx, 1 / sy);
    ctx.lineCap = "round";
    ctx.strokeStyle = "#1a120e";
    ctx.fillStyle = "#1a120e";
    if (mode === "dead") {
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(-6.2, -22);
      ctx.lineTo(6.2, 22);
      ctx.moveTo(6.2, -22);
      ctx.lineTo(-6.2, 22);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.ellipse(0, 0, 6.2, 22.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f6f1e7";
      ctx.beginPath();
      ctx.ellipse(2.2, lookY - 0.6, 2.05, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
}

const panels = [
  ["평소", "idle", 1, 1],
  ["점프", "jump", 0.94, 1.3],
  ["착지", "land", 1.28, 0.66],
  ["끝", "dead", 1, 1],
];
panels.forEach((p, i) => {
  const x = 190 + i * 350;
  bot(x, 300, p[2], p[3], p[1]);
  ctx.fillStyle = "#f4efe6";
  ctx.font = "600 32px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(p[0], x, 430);
});
</script>
</body>
</html>
